<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A searchable and sortable table built with JavaScript.">
        <link rel="stylesheet" href="css/style.css">
        <title>Data - CS309 Lab</title>
    </head>

    <body>
        <a class="skip-link" href="#main">Skip to main content</a>

        <header class="site-header">
            <div class="container">
                <p class="site-title">We Are in Testing Phase</p>

                <nav class="site-nav" aria-label="Main">
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                    <a href="components.html">Components</a>
                    <a href="validation.html">Validation</a>
                    <a href="data.html" aria-current="page">Data</a>
                </nav>
            </div>
        </header>

        <main id="main" class="container">
            <h1>People</h1>

            <div class="toolbar">
                <div class="field">
                    <label for="search">Search</label>
                    <input type="search" id="search" placeholder="Name, age or city">
                </div>

                <div class="btn-row">
                    <button type="button" class="btn" data-sort="name" aria-pressed="false">Sort by name</button>
                    <button type="button" class="btn" data-sort="age" aria-pressed="false">Sort by age</button>
                </div>
            </div>

            <p class="count" id="count" aria-live="polite"></p>

            <div class="table-wrap" role="region" aria-labelledby="people-caption" tabindex="0">
                <table id="peopleTable">
                    <caption id="people-caption">People list</caption>
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Age</th>
                            <th scope="col">City</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 Cairo University Faculty Of Science</p>
            </div>
        </footer>

        <script src="js/data.js"></script>
    </body>
</html>

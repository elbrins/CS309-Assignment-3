<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Registration form with JavaScript validation.">
        <link rel="stylesheet" href="css/style.css">
        <title>Registration - CS309 Lab</title>
    </head>

    <body>
        <a class="skip-link" href="#main">Skip to main content</a>

        <header class="site-header">
            <div class="container">
                <p class="site-title">We Are in Testing Phase</p>

                <nav class="site-nav" aria-label="Main">
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                    <a href="components.html">Components</a>
                    <a href="validation.html" aria-current="page">Validation</a>
                    <a href="data.html">Data</a>
                </nav>
            </div>
        </header>

        <main id="main" class="container">
            <h1>Registration</h1>
            <p class="hint">All fields are required.</p>

            <div class="alert alert-success" id="successBox" role="status" hidden>
                <strong>Done.</strong> Your registration passed all the checks.
            </div>

            <form id="regForm" class="card form-card" novalidate>
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-error">
                    <p class="error" id="name-error"></p>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error">
                    <p class="error" id="email-error"></p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" aria-describedby="password-hint password-error">
                    <p class="hint" id="password-hint">At least 8 characters, with at least one number.</p>
                    <p class="error" id="password-error"></p>
                </div>

                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input type="password" id="confirm" name="confirm" autocomplete="new-password" aria-describedby="confirm-error">
                    <p class="error" id="confirm-error"></p>
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" aria-describedby="age-error">
                    <p class="error" id="age-error"></p>
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 Cairo University Faculty Of Science</p>
            </div>
        </footer>

        <script src="js/validation.js"></script>
    </body>
</html>
